name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write   # optional (only needed for some actions)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Verify build output
        run: |
          echo "Working directory: $(pwd)"
          echo "Contents:" 
          ls -la
          if [ -d ./dist ]; then echo "dist exists:"; ls -la ./dist; else echo "dist missing"; fi
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Use a repo secret named DEPLOY_TOKEN (PAT with repo + pages + workflow write permissions)
          github_token: ${{ secrets.DEPLOY_TOKEN }}
          publish_dir: ./dist
